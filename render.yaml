services:
  - type: web
    name: karachi-redbus-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DRIVER_PASSWORD
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false